<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الصفحة الرئيسية - نرمين</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- شريط التنقل العلوي -->
    <header class="navbar">
        <div class="logo">نرمين</div>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html" class="active">الرئيسية</a></li>
                <li><a href="journey.html">رحلتنا</a></li>
                <li><a href="words.html">كلماتنا</a></li>
                <li><a href="gallery.html">معرضنا</a></li>
            </ul>
        </nav>
    </header>

    <!-- القسم الرئيسي وخلفية الطبيعة الفخمة مع عداد الوقت -->
    <main class="hero-section">
        <div class="overlay"></div>
        <div class="content-container">
            <h1>عداد الوقت - نرمين</h1>
            
            <!-- عداد الوقت التنازلي -->
            <div class="countdown-timer" id="countdown">
                <div class="time-box">
                    <span id="days">00</span>
                    <label>يوم</label>
                </div>
                <div class="time-box">
                    <span id="hours">00</span>
                    <label>ساعة</label>
                </div>
                <div class="time-box">
                    <span id="minutes">00</span>
                    <label>دقيقة</label>
                </div>
                <div class="time-box">
                    <span id="seconds">00</span>
                    <label>ثانية</label>
                </div>
            </div>

            <!-- مساحة فارغة لكتابة الكلمات حسب رغبتك -->
            <div class="custom-text-box">
                <p>مخصص خصيصاً لكِ يا نرمين... اكتب هنا الكلمات التي تريد إضافتها...</p>
            </div>
        </div>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
