<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>نرمين ❤️</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden; /* الشاشة ثابتة */
}

body{
  font-family:"Cairo",sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at 20% 20%, rgba(255,55,120,.25), transparent 35%),
    radial-gradient(circle at 80% 80%, rgba(125,60,255,.20), transparent 40%),
    linear-gradient(135deg,#07030b,#190814,#08030c);
}

/* خلفية الجزيئات */
#particles{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
}

/* دوائر الإضاءة */
.glow{
  position:fixed;
  width:60vw;
  height:60vw;
  border-radius:50%;
  filter:blur(100px);
  opacity:.18;
  pointer-events:none;
}

.glow1{
  background:#ff3477;
  top:-25vw;
  right:-20vw;
}

.glow2{
  background:#864dff;
  bottom:-30vw;
  left:-20vw;
}

/* القلوب */
.heart{
  position:fixed;
  bottom:-50px;
  color:#ff5b91;
  text-shadow:0 0 18px #ff3b7a;
  pointer-events:none;
  z-index:1;
  animation:heartMove linear forwards;
}

@keyframes heartMove{
  0%{
    transform:translateY(0) scale(.6);
    opacity:0;
  }

  15%{
    opacity:.7;
  }

  100%{
    transform:translateY(-115vh) scale(1.3) rotate(180deg);
    opacity:0;
  }
}

/* الشاشة الرئيسية */
.screen{
  position:relative;
  z-index:2;
  width:100%;
  height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px;
}

/* البطاقة */
.card{
  width:min(900px,100%);
  max-height:95vh;

  padding:clamp(22px,5vw,55px);

  text-align:center;

  background:linear-gradient(
    135deg,
    rgba(255,255,255,.11),
    rgba(255,255,255,.035)
  );

  border:1px solid rgba(255,255,255,.15);

  border-radius:35px;

  box-shadow:
    0 30px 100px rgba(0,0,0,.5),
    0 0 60px rgba(255,50,120,.12);

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  animation:cardIn 1.2s ease;
}

@keyframes cardIn{
  from{
    opacity:0;
    transform:scale(.94);
  }

  to{
    opacity:1;
    transform:scale(1);
  }
}

.top-text{
  color:#ffb1ca;
  font-size:clamp(12px,2vw,16px);
  letter-spacing:2px;
  margin-bottom:12px;
}

h1{
  font-size:clamp(48px,10vw,100px);
  line-height:1;

  background:linear-gradient(
    135deg,
    #ffffff,
    #ff73a4,
    #c08cff
  );

  -webkit-background-clip:text;
  background-clip:text;

  color:transparent;

  filter:drop-shadow(
    0 0 25px rgba(255,60,130,.35)
  );
}

/* القلب الرئيسي */
.main-heart{
  font-size:clamp(35px,7vw,65px);
  margin:10px 0;

  color:#ff3b7a;

  text-shadow:0 0 25px #ff3b7a;

  animation:beat 1.3s infinite;
}

@keyframes beat{
  0%,100%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.18);
  }
}

.message{
  font-size:clamp(14px,2.5vw,20px);
  color:rgba(255,255,255,.78);

  line-height:1.9;

  max-width:650px;
  margin:0 auto 22px;
}

/* العداد */
.timer-title{
  font-size:clamp(15px,2.5vw,20px);
  color:#ffb4cb;

  margin-bottom:15px;
}

.timer{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;

  max-width:750px;
  margin:auto;
}

.time-box{
  padding:clamp(12px,2vw,20px) 5px;

  background:rgba(0,0,0,.22);

  border:1px solid rgba(255,255,255,.1);

  border-radius:20px;
}

.time-number{
  display:block;

  font-size:clamp(25px,5vw,52px);
  font-weight:800;

  font-variant-numeric:tabular-nums;

  color:#fff;

  text-shadow:0 0 20px rgba(255,60,130,.4);
}

.time-label{
  display:block;

  color:#ff9dbf;

  font-size:clamp(11px,2vw,14px);

  margin-top:4px;
}

.date{
  margin-top:18px;

  color:rgba(255,255,255,.55);

  font-size:clamp(11px,2vw,14px);
}

.footer{
  margin-top:18px;

  color:#ff9dbf;

  font-size:clamp(13px,2vw,17px);
}

/* للموبايل */
@media(max-width:600px){

  .screen{
    padding:12px;
  }

  .card{
    padding:25px 15px;
    border-radius:28px;
  }

  .timer{
    gap:7px;
  }

  .time-box{
    border-radius:15px;
    padding:12px 3px;
  }

  .message{
    margin-bottom:15px;
  }

}

/* للشاشات القصيرة */
@media(max-height:650px){

  .card{
    padding:18px;
  }

  .message{
    line-height:1.5;
    margin-bottom:10px;
  }

  .main-heart{
    margin:4px 0;
  }

  .date,
  .footer{
    margin-top:10px;
  }

}
</style>
</head>

<body>

<!-- خلفية الجزيئات -->
<canvas id="particles"></canvas>

<div class="glow glow1"></div>
<div class="glow glow2"></div>


<!-- الشاشة الثابتة -->
<main class="screen">

  <div class="card">

    <div class="top-text">
      A BEAUTIFUL STORY BEGINS
    </div>

    <h1>نارمين</h1>

    <div class="main-heart">♥</div>

    <p class="message">
      من أول كلمة اتكلمناها...
      <br>
      بدأ وقت مختلف، وبداية حكاية جميلة ❤️
    </p>


    <div class="timer-title">
      ⏳ الوقت اللي عدّى من أول كلام بينا
    </div>


    <div class="timer">

      <div class="time-box">
        <span class="time-number" id="days">0</span>
        <span class="time-label">يوم</span>
      </div>

      <div class="time-box">
        <span class="time-number" id="hours">00</span>
        <span class="time-label">ساعة</span>
      </div>

      <div class="time-box">
        <span class="time-number" id="minutes">00</span>
        <span class="time-label">دقيقة</span>
      </div>

      <div class="time-box">
        <span class="time-number" id="seconds">00</span>
        <span class="time-label">ثانية</span>
      </div>

    </div>


    <div class="date">
      البداية: 31 أغسطس 2026 — الساعة 1:00 صباحًا ❤️
    </div>


    <div class="footer">
      وكل ثانية بتعدّي... بتبقى جزء من الحكاية ♥
    </div>

  </div>

</main>


<script>

/* =====================
   العداد
===================== */

const startDate =
  new Date("2026-08-31T01:00:00+03:00");


function updateTimer(){

  const now = new Date();

  let difference =
    now - startDate;


  if(difference < 0){
    difference = 0;
  }


  const totalSeconds =
    Math.floor(difference / 1000);


  const days =
    Math.floor(
      totalSeconds / 86400
    );


  const hours =
    Math.floor(
      (totalSeconds % 86400) / 3600
    );


  const minutes =
    Math.floor(
      (totalSeconds % 3600) / 60
    );


  const seconds =
    totalSeconds % 60;


  document.getElementById("days").textContent =
    days;


  document.getElementById("hours").textContent =
    String(hours).padStart(2,"0");


  document.getElementById("minutes").textContent =
    String(minutes).padStart(2,"0");


  document.getElementById("seconds").textContent =
    String(seconds).padStart(2,"0");

}


updateTimer();

setInterval(updateTimer,1000);



/* =====================
   القلوب المتحركة
===================== */

function createHeart(){

  const heart =
    document.createElement("div");


  heart.className =
    "heart";


  const hearts =
    ["♥","♡","❤"];


  heart.textContent =
    hearts[
      Math.floor(
        Math.random() *
        hearts.length
      )
    ];


  heart.style.left =
    Math.random() * 100 + "vw";


  heart.style.fontSize =
    12 + Math.random() * 25 + "px";


  heart.style.animationDuration =
    8 + Math.random() * 6 + "s";


  document.body.appendChild(heart);


  setTimeout(
    () => heart.remove(),
    15000
  );

}


setInterval(
  createHeart,
  1100
);



/* =====================
   الجزيئات المضيئة
===================== */

const canvas =
  document.getElementById("particles");


const ctx =
  canvas.getContext("2d");


let dots = [];


function resize(){

  canvas.width =
    window.innerWidth;


  canvas.height =
    window.innerHeight;


  dots = [];


  const amount =
    Math.min(
      100,
      Math.floor(
        window.innerWidth / 12
      )
    );


  for(
    let i = 0;
    i < amount;
    i++
  ){

    dots.push({

      x:
        Math.random() *
        canvas.width,


      y:
        Math.random() *
        canvas.height,


      size:
        Math.random() * 2 + .3,


      speed:
        Math.random() * .25 + .05,


      opacity:
        Math.random() * .6 + .1

    });

  }

}


function animate(){

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  dots.forEach(dot => {

    dot.y -=
      dot.speed;


    if(dot.y < -5){

      dot.y =
        canvas.height + 5;


      dot.x =
        Math.random() *
        canvas.width;

    }


    ctx.beginPath();


    ctx.arc(
      dot.x,
      dot.y,
      dot.size,
      0,
      Math.PI * 2
    );


    ctx.fillStyle =
      `rgba(255,220,235,${dot.opacity})`;


    ctx.fill();

  });


  requestAnimationFrame(
    animate
  );

}


window.addEventListener(
  "resize",
  resize
);


resize();

animate();

</script>

</body>
</html>
